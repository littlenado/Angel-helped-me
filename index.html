<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v86 Legacy Windows Emulator</title>
    <!-- Include your local libv86.js dependency -->
    <script src="./libv86.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #202124;
            color: #f1f3f4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 10px;
            color: #34a853;
        }
        .controls {
            margin-bottom: 15px;
            background-color: #292a2d;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            max-width: 800px;
        }
        .upload-section {
            border-top: 1px solid #5f6368;
            padding-top: 15px;
            margin-top: 5px;
            width: 100%;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }
        label {
            font-weight: 500;
        }
        select, button, input[type="file"]::file-selector-button {
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #5f6368;
            background-color: #3c4043;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }
        input[type="file"] {
            color: #f1f3f4;
            font-size: 14px;
        }
        select:focus, button:focus {
            outline: 2px solid #34a853;
        }
        button:hover, input[type="file"]::file-selector-button:hover {
            background-color: #4f5357;
        }
        button:disabled {
            background-color: #1e2022;
            color: #70757a;
            cursor: not-allowed;
        }
        /* Container style required by v86 for canvas resizing */
        #screen_container {
            white-space: pre;
            font-family: Courier, monospace;
            font-size: 14px;
            line-height: 14px;
            background-color: #000;
            border: 4px solid #3c4043;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-top: 10px;
        }
        #screen_container canvas {
            display: block;
        }
        .status {
            margin-top: 10px;
            font-style: italic;
            color: #bfa;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Legacy Windows Environment</h1>
    
    <div class="controls">
        <div>
            <label for="os-select">Preset Target OS Profile:</label>
            <select id="os-select">
                <option value="win95">Windows 95 (64MB RAM, Requires Boot Floppy)</option>
                <option value="winnt4">Windows NT 4.0 (128MB RAM, Safe Mode IDE)</option>
                <option value="win2000">Windows 2000 (256MB RAM, Legacy ACPI=Off)</option>
                <option value="winxp" selected>Windows XP (512MB RAM, Stable Kernel Target)</option>
                <option value="custom">-- Use Custom Local File Uploads Below --</option>
            </select>
        </div>
        <button id="start-btn">Boot Emulator</button>

        <!-- Dynamic execution zone allowing local PC file injections -->
        <div class="upload-section">
            <strong>Custom PC File Injections (Optional):</strong>
            <div>
                <label for="local-cdrom">ISO/CD-ROM Image:</label>
                <input type="file" id="local-cdrom" accept=".iso,.img">
            </div>
            <div>
                <label for="local-fda">Floppy Disk (Boot .img):</label>
                <input type="file" id="local-fda" accept=".img,.ima">
            </div>
        </div>
    </div>

    <!-- The emulator runtime binds directly to this target element -->
    <div id="screen_container"></div>
    
    <div id="status-text" class="status">Emulator ready. Connect any custom files if desired, then click Boot.</div>

    <script>
        let emulator = null;
        const startBtn = document.getElementById('start-btn');
        const osSelect = document.getElementById('os-select');
        const statusText = document.getElementById('status-text');
        
        // Input handle trackers
        const localCdromInput = document.getElementById('local-cdrom');
        const localFdaInput = document.getElementById('local-fda');

        // Presets structure mapped to the local web workspace
        const OS_CONFIGS = {
            win95: {
                name: "Windows 95",
                memory_size: 64 * 1024 * 1024,
                vga_memory_size: 4 * 1024 * 1024,
                fda: { url: "./images/win95_bootdisk.img" }, 
                cdrom: { url: "./images/windows95.iso" },
                hda: { url: "./images/win95_hda.img", async: true }
            },
            winnt4: {
                name: "Windows NT 4.0",
                memory_size: 128 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,
                cdrom: { url: "./images/windowsnt4.iso" },
                hda: { url: "./images/winnt4_hda.img", async: true }
            },
            win2000: {
                name: "Windows 2000",
                memory_size: 256 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,
                cdrom: { url: "./images/windows2000.iso" },
                hda: { url: "./images/win2k_hda.img", async: true }
            },
            winxp: {
                name: "Windows XP",
                memory_size: 512 * 1024 * 1024, 
                vga_memory_size: 16 * 1024 * 1024, 
                cdrom: { url: "./images/windowsxp.iso" },
                hda: { url: "./images/winxp_hda.img", async: true }
            },
            custom: {
                name: "Custom Machine Configuration",
                memory_size: 512 * 1024 * 1024, // Default baseline for raw file allocations
                vga_memory_size: 16 * 1024 * 1024,
                hda: { url: "./images/winxp_hda.img", async: true } // Reuse standard block allocation
            }
        };

        startBtn.addEventListener('click', () => {
            const selectedOS = osSelect.value;
            const config = OS_CONFIGS[selectedOS];

            // Safely clear out any running instance before reloading state
            if (emulator) {
                statusText.innerText = "Stopping active runtime instance...";
                emulator.stop();
                document.getElementById('screen_container').innerHTML = '';
            }

            statusText.innerText = `Booting ${config.name} configuration profiles...`;
            startBtn.disabled = true;
            osSelect.disabled = true;

            // Assemble default base runtime parameters
            const emulatorOptions = {
                wasm_path: "./v86.wasm",
                bios: { url: "./bios.bin-1.10.0" },      
                vga_bios: { url: "./vgabios.bin" },      
                screen_container: document.getElementById("screen_container"),
                memory_size: config.memory_size,
                vga_memory_size: config.vga_memory_size,
                hda: config.hda,
                bios_eager_init: true,
                acpi: false                              
            };

            // ---- DRIVE SOURCE ROUTING RULES ----

            // 1. Process custom local CDROM / ISO if selected from your PC
            if (localCdromInput.files.length > 0) {
                statusText.innerText = "Mapping custom local CD-ROM image from your PC...";
                emulatorOptions.cdrom = { buffer: localCdromInput.files[0] };
            } else if (config.cdrom) {
                // Fallback to local server image folder asset paths if empty
                emulatorOptions.cdrom = config.cdrom;
            }

            // 2. Process custom local Floppy Boot Disk if uploaded from your PC
            if (localFdaInput.files.length > 0) {
                statusText.innerText = "Mapping custom local floppy bootloader image...";
                emulatorOptions.fda = { buffer: localFdaInput.files[0] };
            } else if (config.fda) {
                // Fallback to folder assets path if preset demands it
                emulatorOptions.fda = config.fda;
            }

            try {
                // Initialize the execution layer
                emulator = new V86Starter(emulatorOptions);
                statusText.innerText = `${config.name} kernel active. Click canvas window to capture keys.`;
            } catch (error) {
                console.error("V86 initialization failure:", error);
                statusText.innerText = "Fatal Error: Failed to structure hardware emulation worker context.";
                startBtn.disabled = false;
                osSelect.disabled = false;
            }
        });
    </script>
</body>
</html>
