<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>v86 Offline Desktop - Windows Longhorn Edition</title>
    <!-- Requires local libv86.js file in the same folder -->
    <script src="libv86.js"></script>
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            flex-direction: column;
            background: #111;
            color: #eee;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            overflow: hidden;
        }

        #boot_bar, #vm_bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            padding: 8px 12px;
            background: #1b1b1b;
            border-bottom: 1px solid #2c2c2c;
            font-size: 13px;
            flex: 0 0 auto;
        }

        #vm_bar { flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; }
        #vm_bar button { flex: 0 0 auto; }

        #vm_bar { border-top: 1px solid #2c2c2c; border-bottom: none; }
        #vm_bar.hidden, #boot_bar.hidden { display: none; }
        .sep { width: 1px; align-self: stretch; background: #333; margin: 0 4px; }

        button, select, .filelabel {
            background: #2a2a2a;
            color: #eee;
            border: 1px solid #454545;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
        }
        button:hover:not(:disabled), .filelabel:hover { background: #353535; }
        button:disabled { opacity: .45; cursor: default; }
        button.active { background: #0a6; border-color: #0c8; }
        #start_btn { background: #0088cc; border-color: #0099e6; font-weight: 600; }
        #start_btn:hover:not(:disabled) { background: #0099e6; }
        #status { color: #9cf; margin-left: auto; }
        .hint { color: #888; }
        kbd { background: #333; border: 1px solid #555; border-radius: 3px; padding: 0 4px; font-size: 11px; }

        #screen_wrap {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            background: #000;
            padding: 6px;
            display: flex;
        }

        #screen_container {
            background: #000;
            outline: none;
            width: max-content;
            margin: auto;
        }
        #screen_container > div {
            white-space: pre;
            font: 14px/14px "DejaVu Sans Mono", "Courier New", monospace;
        }
        #screen_container canvas {
            display: none;
            background: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #screen_container:fullscreen { background: #000; }
    </style>
</head>
<body>

<div id="boot_bar">
    <label class="filelabel">
        Select Longhorn image - boots automatically (.iso / .img)
        <input type="file" id="disk_file" style="display:none;">
    </label>
    <span id="file_name" class="hint"></span>

    <label>RAM:
        <select id="ram_size">
            <option value="256">256 MB</option>
            <option value="512" selected>512 MB (recommended)</option>
            <option value="1024">1024 MB</option>
        </select>
    </label>

    <label>Disk (for .iso installs):
        <select id="hdd_size">
            <option value="1">1 GB</option>
            <option value="2">2 GB</option>
            <option value="4">4 GB</option>
            <option value="6" selected>6 GB (Longhorn min)</option>
            <option value="8">8 GB</option>
        </select>
    </label>

    <button id="start_btn">Boot</button>
    <span id="status">Pick an image, then press Boot.</span>
</div>

<div id="vm_bar" class="hidden">
    <!-- data-key values are DOM keyCodes (v86 keyboard_send_keys expects those, not scancodes) -->
    <button data-key="27" title="Esc">Esc</button>
    <button data-key="13" title="Enter">Enter</button>
    <button data-key="32" title="Space">Space</button>
    <button data-key="9" title="Tab">Tab</button>
    <button data-key="33" title="Page Up">PgUp</button>
    <button data-key="34" title="Page Down">PgDn</button>
    <button data-key="114" title="F3 (quit setup)">F3</button>
    <button data-key="119" title="F8 (accept license)">F8</button>
    <button data-key="38" title="Up">&#8593;</button>
    <button data-key="40" title="Down">&#8595;</button>
    <span class="sep"></span>
    <button id="cad_btn" title="Ctrl+Alt+Del">Ctrl+Alt+Del</button>
    <button id="pause_btn">Pause</button>
    <button id="reset_btn">Reset</button>
    <span class="sep"></span>
    <button id="zoom_out" title="Smaller">A-</button>
    <button id="zoom_in" title="Bigger">A+</button>
    <button id="fit_btn" class="active" title="Scale the VM screen to the window">Fit</button>
    <button id="fs_btn" title="Fullscreen">Fullscreen</button>
    <span class="hint" title="Click the screen to capture the mouse; press Esc to release it.">Click screen to grab mouse</span>
</div>

<!-- v86 appends its text layer and canvas here; keeping the id matters for fullscreen -->
<div id="screen_wrap">
    <div id="screen_container" tabindex="0"><div></div><canvas></canvas></div>
</div>

<script>
    let emulator = null;
    let zoomLevel = 1;      // CSS zoom applied to the VM screen
    let autoFit = true;     // keep the screen fitted to the window

    const $ = (id) => document.getElementById(id);

    function setStatus(text) {
        $('status').textContent = text;
    }

    /* ---------- screen scaling ---------- */

    // v86 keeps the screen at its native size; we scale the whole element with CSS
    // zoom, which (unlike a transform) also updates layout so scrolling and
    // centering keep working when the screen is bigger than the window.
    function applyZoom(z) {
        zoomLevel = Math.max(0.4, Math.min(4, z));
        $('screen_container').style.zoom = zoomLevel;
        $('zoom_in').disabled = zoomLevel >= 4;
        $('zoom_out').disabled = zoomLevel <= 0.4;
    }

    function fitToWindow() {
        if (!emulator) return;
        const wrap = $('screen_wrap');
        const box = $('screen_container').getBoundingClientRect();
        if (!box.width || !box.height) return;
        const availW = wrap.clientWidth - 14;
        const availH = wrap.clientHeight - 14;
        if (availW <= 0 || availH <= 0) return;
        const target = zoomLevel * Math.min(availW / box.width, availH / box.height);
        if (Math.abs(target - zoomLevel) / zoomLevel > 0.02) applyZoom(target);
    }

    function refit() {
        if (autoFit) fitToWindow();
    }

    // v86 reports new native screen sizes on mode changes (text <-> graphics, resolution).
    function hookScreenEvents() {
        emulator.add_listener('screen-set-size', function () {
            setTimeout(refit, 40);
        });
    }

    window.addEventListener('resize', function () { setTimeout(refit, 60); });
    document.addEventListener('fullscreenchange', function () { setTimeout(refit, 60); });

    // ---------- boot ----------

    async function boot() {
        const fileInput = $('disk_file');
        if (fileInput.files.length === 0) {
            alert('Please select your Windows Longhorn image file first!');
            return;
        }
        if (emulator) {
            alert('The emulator is already running. Press Reset, or reload the page to start over.');
            return;
        }

        const file = fileInput.files[0];
        const isIso = file.name.toLowerCase().endsWith('.iso');
        const ramMb = parseInt($('ram_size').value, 10);
        const hddGb = parseInt($('hdd_size').value, 10);

        // Modern v86 builds export the class as window.V86; older ones used V86Starter.
        const V86Class = window.V86 || window.V86Starter;
        if (typeof V86Class !== 'function') {
            alert('libv86.js did not load correctly (no V86 class found). Check that libv86.js is next to index.html.');
            return;
        }

        const config = {
            wasm_path: 'v86.wasm',
            screen_container: $('screen_container'),
            bios: { url: 'seabios.bin' },
            vga_bios: { url: 'vgabios.bin' },
            memory_size: ramMb * 1024 * 1024,
            vga_memory_size: 16 * 1024 * 1024,
            autostart: false
        };

        // v86's on-demand reader for File objects stalls boots in this build, so pull
        // images up to 2 GB into memory; larger ones stay lazy to avoid the RAM cost.
        setStatus('Reading ' + file.name + ' (' + Math.round(file.size / 1048576) + ' MB)...');
        let imageBuffer = null;
        if (file.size <= 2 * 1024 * 1024 * 1024) {
            try {
                imageBuffer = await file.arrayBuffer();
            } catch (err) {
                alert('Could not read the image: ' + err.message);
                return;
            }
        }
        const image = imageBuffer ? { buffer: imageBuffer } : { buffer: file };

        if (isIso) {
            config.cdrom = image;

            // Windows Setup needs a writable disk to install onto. This one lives in RAM
            // only (it is gone when the page is reloaded). ArrayBuffers are zero-filled
            // lazily, so allocating several GB is cheap until the guest writes to it.
            setStatus('Allocating ' + hddGb + ' GB virtual hard disk...');
            try {
                config.hda = { buffer: new ArrayBuffer(hddGb * 1024 * 1024 * 1024) };
            } catch (err) {
                alert('Could not allocate a ' + hddGb + ' GB disk: ' + err.message +
                      '\nTry a smaller disk size.');
                return;
            }
        } else {
            // Any other image is treated as the primary hard drive.
            config.hda = image;
        }

        try {
            emulator = new V86Class(config);
        } catch (err) {
            alert('Initialization error: ' + err.message);
            return;
        }

        $('start_btn').disabled = true;
        $('boot_bar').classList.add('hidden');
        $('vm_bar').classList.remove('hidden');
        setStatus('v86 started: ' + ramMb + ' MB RAM' + (isIso ? ', ' + hddGb + ' GB RAM disk' : '') + '.');

        let cpuStarted = false;
        emulator.add_listener('emulator-ready', function () {
            if (!emulator.is_running()) emulator.run();
            if (!cpuStarted) setStatus('Emulator ready - booting...');
        });
        emulator.add_listener('emulator-stopped', function () { cpuStarted = false; setStatus('CPU paused.'); });
        emulator.add_listener('emulator-started', function () { cpuStarted = true; setStatus('CPU running.'); });
        emulator.add_listener('download-progress', function (e) {
            if (e && e.file_name) {
                const pct = e.lengthComputable ? ' (' + Math.round(100 * e.loaded / e.total) + '%)' : '';
                setStatus('Loading ' + e.file_name + pct);
            }
        });
        emulator.add_listener('download-error', function (e) {
            setStatus('Download failed: ' + (e && e.file_name ? e.file_name : '?') +
                      ' - check seabios.bin / vgabios.bin / v86.wasm.');
        });

        hookScreenEvents();

        // Listeners must exist before the CPU starts, otherwise the start events are lost.
        emulator.run();

        // v86 sizes itself asynchronously; fit once it has drawn something.
        setTimeout(fitToWindow, 800);
        setTimeout(fitToWindow, 3000);

        $('screen_container').focus();
    }

    // Picking an image boots it right away; the Boot button stays as a manual fallback.
    $('disk_file').onchange = function () {
        const file = this.files[0];
        if (!file) return;
        $('file_name').textContent = file.name + ' (' + (file.size / (1024 * 1024)).toFixed(0) + ' MB)';
        setStatus('Starting...');
        setTimeout(boot, 50);
    };

    $('start_btn').onclick = boot;

    /* ---------- controls ---------- */

    document.querySelectorAll('#vm_bar button[data-key]').forEach(function (btn) {
        btn.onclick = function () {
            if (emulator) emulator.keyboard_send_keys([Number(btn.dataset.key)]);
        };
    });

    $('cad_btn').onclick = function () {
        if (emulator) emulator.keyboard_send_scancodes([0x1D, 0x38, 0x53, 0xD3, 0xB8, 0x9D]);
    };

    let paused = false;
    $('pause_btn').onclick = function () {
        if (!emulator) return;
        if (!paused) { emulator.stop(); paused = true; $('pause_btn').textContent = 'Resume'; $('pause_btn').classList.add('active'); }
        else { emulator.run(); paused = false; $('pause_btn').textContent = 'Pause'; $('pause_btn').classList.remove('active'); }
    };

    $('reset_btn').onclick = function () {
        if (emulator) emulator.restart();
    };

    $('zoom_in').onclick = function () { autoFit = false; $('fit_btn').classList.remove('active'); applyZoom(zoomLevel * 1.25); };
    $('zoom_out').onclick = function () { autoFit = false; $('fit_btn').classList.remove('active'); applyZoom(zoomLevel / 1.25); };
    $('fit_btn').onclick = function () {
        autoFit = !autoFit;
        $('fit_btn').classList.toggle('active', autoFit);
        if (autoFit) fitToWindow();
    };

    $('fs_btn').onclick = function () {
        const el = $('screen_container');
        if (document.fullscreenElement) { document.exitFullscreen(); return; }
        (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || function () {}).call(el);
    };

    // Clicking the screen gives it keyboard focus (v86 listens on document, so keys
    // work either way, but focus keeps the browser toolbar from stealing them).
    $('screen_container').addEventListener('mousedown', function () {
        $('screen_container').focus();
    });
</script>
</body>
</html>
